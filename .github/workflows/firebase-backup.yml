name: Backup giornaliero database Firebase

on:
  schedule:
    # Ogni giorno alle 02:00 UTC (~03:00/04:00 ora italiana a seconda dell'ora legale)
    - cron: '0 2 * * *'
  workflow_dispatch: {}  # permette anche l'avvio manuale dal tab "Actions" su GitHub

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repository privato dei backup
        uses: actions/checkout@v4
        with:
          repository: christianitelyum-coder/tracker-cassoni-backups
          token: ${{ secrets.BACKUP_REPO_TOKEN }}

      - name: Scarica il database Firebase
        run: |
          mkdir -p backups
          DATE=$(date -u +"%Y-%m-%d")
          URL="https://cassoni-centrorisorse-default-rtdb.europe-west1.firebasedatabase.app/.json"
          curl -sS -f "$URL" -o "backups/backup-$DATE.json"
          echo "Dimensione backup:"
          wc -c "backups/backup-$DATE.json"

      - name: Elimina backup più vecchi di 90 giorni
        run: |
          find backups -name 'backup-*.json' -mtime +90 -print -delete

      - name: Commit e push del backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          if git diff --staged --quiet; then
            echo "Nessuna modifica da salvare (backup identico al precedente)."
          else
            git commit -m "Backup automatico Firebase $(date -u +"%Y-%m-%d")"
            git push
          fi

